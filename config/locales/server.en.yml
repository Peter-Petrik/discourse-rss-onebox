en:
  site_settings:
    rss_onebox_enabled: "Render RSS Polling imports in the selected categories as a onebox of the article URL, and hide Show Full Post in those categories."
    rss_onebox_categories: "Categories whose RSS-imported topics are rendered as a onebox. No categories selected means the plugin has no effect."
    rss_onebox_enhanced: "When an article's own page provides no description, show the feed's summary inside the link preview, or the article's opening paragraph if the feed has none. When off, link previews show only what the article page provides. Changes apply to existing topics after running rake rss_onebox:enhance REBAKE=1 APPLY=1."
    rss_onebox_youtube_descriptions: "Show the video's description from the YouTube feed below the player in RSS-imported topics. When off, only the player is shown. Changes apply to existing topics after running rake rss_onebox:enhance REBAKE=1 APPLY=1."
    rss_onebox_blog_title_format: "Title format for topics imported from blog feeds (every feed that is not YouTube). %%{title} is the post's title and %%{source} the blog's name (its display name from the plugin's Display names page, or else the name published in its feed), for example \"Blog: %%{title}\" or \"%%{source}: %%{title}\". The default, %%{title}, leaves titles unchanged; an empty value does the same. Existing topics are renamed silently by rake rss_onebox:enhance APPLY=1."
    rss_onebox_youtube_title_format: "Title format for topics imported from YouTube channel feeds. %%{title} is the video's title and %%{source} the channel's name (its display name from the plugin's Display names page, or else the name published in its feed), for example \"Video: %%{title}\" or \"%%{source}: %%{title}\". The default, %%{title}, leaves titles unchanged; an empty value does the same. Existing topics are renamed silently by rake rss_onebox:enhance APPLY=1."
