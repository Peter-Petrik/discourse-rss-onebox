en:
  site_settings:
    rss_onebox_enabled: "Render RSS Polling imports in the selected categories as a onebox of the article URL, and hide Show Full Post in those categories."
    rss_onebox_categories: "Categories whose RSS-imported topics are rendered as a onebox. No categories selected means the plugin has no effect."
    rss_onebox_enhanced: "When an article's own page provides no description, show the feed's summary inside the link preview, or the article's opening paragraph if the feed has none. When off, link previews show only what the article page provides. Changes apply to existing topics after running rake rss_onebox:enhance REBAKE=1 APPLY=1."
    rss_onebox_youtube_descriptions: "Show the video's description from the YouTube feed below the player in RSS-imported topics. When off, only the player is shown. Changes apply to existing topics after running rake rss_onebox:enhance REBAKE=1 APPLY=1."
